<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto | TechStyle Admin</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Header Navigation (Admin Simplified) -->
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="{{ url_for('index') }}" class="logo">Tech<span>Style</span>.</a>

                <div class="nav-links">
                    <a href="{{ url_for('index') }}">Ver Tienda</a>
                    <span style="color: var(--text-secondary);">|</span>
                    <a href="#" style="color: var(--primary); font-weight: 700;">Panel de Administración</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Edit Product Section -->
    <div class="auth-wrapper" style="min-height: calc(100vh - 80px);">
        <div class="auth-card" style="max-width: 600px;">
            <div class="auth-header">
                <h1 class="auth-title">Editar Producto</h1>
                <p class="auth-subtitle">Modificando: <strong>{{ product.name }}</strong></p>
            </div>

            <form action="/product/edit/{{ product.id }}" method="POST" enctype="multipart/form-data">

                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre del Producto</label>
                    <input type="text" id="nombre" name="nombre" class="form-input" value="{{ product.nombre }}"
                        required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="precio" class="form-label">Precio (€)</label>
                        <input type="number" id="precio" name="precio" class="form-input" step="0.01"
                            value="{{ product.precio }}" required>
                    </div>

                    <div class="form-group">
                        <label for="stock" class="form-label">Stock</label>
                        <input type="number" id="stock" name="stock" class="form-input" value="{{ product.stock }}"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="imagen" class="form-label">Imagen del Producto</label>
                    <input type="file" id="imagen" name="imagen" class="form-input" accept="image/*">
                    {% if product.imagen_url %}
                    <small style="color: var(--text-secondary); margin-top: 0.5rem; display: block;">
                        Imagen actual: {{ product.imagen_url }}
                    </small>
                    {% endif %}
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="auth-btn"
                        style="background-color: var(--bg-body); color: var(--text-main); border: 1px solid var(--border-color);"
                        onclick="window.history.back()">Cancelar</button>
                    <button type="submit" class="auth-btn">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
