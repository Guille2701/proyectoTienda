{% extends 'base.html' %}

{% block title %}Añadir Producto | TechStyle Admin{% endblock %}

{% block nav_links %}
<a href="{{ url_for('index') }}">Ver Tienda</a>
<span style="color: var(--text-secondary);">|</span>
<a href="#" style="color: var(--primary); font-weight: 700;">Panel de Administración</a>
{% endblock %}

{% block content %}
<!-- Add Product Section -->
<div class="auth-wrapper" style="min-height: calc(100vh - 80px);">
    <div class="auth-card" style="max-width: 600px;">
        <div class="auth-header">
            <h1 class="auth-title">Añadir Nuevo Producto</h1>
            <p class="auth-subtitle">Ingresa los detalles del nuevo artículo para la tienda</p>
        </div>

        <form action="/product/add" method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label for="nombre" class="form-label">Nombre del Producto</label>
                <input type="text" id="nombre" name="nombre" class="form-input" placeholder="Ej: Auriculares Bluetooth"
                    required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="precio" class="form-label">Precio (€)</label>
                    <input type="number" id="precio" name="precio" class="form-input" step="0.01" placeholder="0.00"
                        required>
                </div>

                <div class="form-group">
                    <label for="stock" class="form-label">Stock</label>
                    <input type="number" id="stock" name="stock" class="form-input" value="10" required>
                </div>
            </div>

            <div class="form-group">
                <label for="imagen" class="form-label">Imagen del Producto</label>
                <input type="file" id="imagen" name="imagen" class="form-input" accept="image/*">
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="button" class="auth-btn"
                    style="background-color: var(--bg-body); color: var(--text-main); border: 1px solid var(--border-color);"
                    onclick="window.history.back()">Cancelar</button>
                <button type="submit" class="auth-btn">Añadir Producto</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
